<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | AI Fitness</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root{
        --blue-100: #eaf6ff;
        --blue-300: #a9dcff;
        --blue-500: #2fa8ff;
        --white: #ffffff;
        --muted: #6b7280;
      }

      html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
      body{
        display:flex;align-items:center;justify-content:center;
        background: linear-gradient(180deg,var(--blue-100) 0%, #f7fbff 50%);
        color:#0f172a;
        padding:32px;
      }

      .container{
        width:100%;max-width:920px;background:transparent;display:flex;gap:32px;align-items:center;justify-content:center;
      }

      .brand{
        flex:1;display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:28px 32px;border-radius:16px;
        background:linear-gradient(135deg,var(--white) 0%, rgba(255,255,255,0.7) 100%);
        box-shadow: 0 8px 24px rgba(47,168,255,0.08);
      }

      .brand h1{margin:0;font-size:28px;color:var(--blue-500)}
      .brand p{margin:0;color:var(--muted)}

      .card{
        flex:1;background:var(--white);padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,0.06);
        max-width:420px;width:100%;
      }

      .tabs{display:flex;gap:8px;margin-bottom:20px}
      .tab{flex:1;padding:10px 14px;text-align:center;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent}
      .tab.active{background:linear-gradient(90deg,var(--blue-100),var(--white));color:var(--blue-500);border-color:rgba(47,168,255,0.18)}

      form{display:flex;flex-direction:column;gap:12px}
      input[type="email"], input[type="password"]{
        padding:12px 14px;border-radius:10px;border:1px solid #e6eef9;background:#fbfeff;font-size:15px;outline:none;
        transition:box-shadow .15s, border-color .15s;
      }
      input:focus{box-shadow:0 6px 20px rgba(47,168,255,0.12);border-color:var(--blue-300)}

      .btn{
        background:var(--blue-500);color:var(--white);border:none;padding:12px 14px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:6px;
        box-shadow: 0 8px 20px rgba(47,168,255,0.14);
      }
      .btn.secondary{background:transparent;color:var(--blue-500);border:1px solid rgba(47,168,255,0.14);box-shadow:none}

      .muted{color:var(--muted);font-size:13px}

      footer{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}

      @media (max-width:900px){
        .container{flex-direction:column;padding:12px}
        .brand{align-items:center;text-align:center}
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="brand">
        <h1>AI Fitness</h1>
        <p>Personalized workout and nutrition guidance — AI-powered and human-friendly.</p>
        <p class="muted">Track progress, set goals, and chat with your fitness assistant.</p>
      </div>

      <div class="card">
        <div class="tabs">
          <div id="tab-login" class="tab active">Login</div>
          <div id="tab-register" class="tab">Create account</div>
        </div>

        <div id="login-panel">
          <form onsubmit="event.preventDefault();login();">
            <label class="muted">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required />

            <label class="muted">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required />

            <button class="btn" type="submit">Log In</button>
            <p id="loginStatus" class="muted"></p>
          </form>
        </div>

        <div id="register-panel" style="display:none;">
          <form onsubmit="event.preventDefault();register();">
            <label class="muted">Email</label>
            <input type="email" id="regEmail" placeholder="you@example.com" required />

            <label class="muted">Password</label>
            <input type="password" id="regPassword" placeholder="Choose a strong password" required />

            <button class="btn" type="submit">Create Account</button>
            <p id="registerStatus" class="muted"></p>
          </form>
        </div>

        <footer>
          <a href="index.html" class="muted">Back to home</a>
        </footer>
      </div>
    </div>

    <script>
      // simple tab switcher (keeps existing ids used by app.js)
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const loginPanel = document.getElementById('login-panel');
      const registerPanel = document.getElementById('register-panel');

      function showLogin(){
        tabLogin.classList.add('active');tabRegister.classList.remove('active');
        loginPanel.style.display='block';registerPanel.style.display='none';
      }
      function showRegister(){
        tabRegister.classList.add('active');tabLogin.classList.remove('active');
        registerPanel.style.display='block';loginPanel.style.display='none';
      }

      tabLogin.addEventListener('click', showLogin);
      tabRegister.addEventListener('click', showRegister);
    </script>

    <script src="app.js"></script>
  </body>
</html>
